<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - 在线OJ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .header {
            background: #2c3e50;
            color: #fff;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 24px; font-weight: 500; }
        .header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            padding: 6px 14px;
            border: 1px solid #fff;
            border-radius: 4px;
            transition: all .2s;
        }
        .header nav a:hover { background: #fff; color: #2c3e50; }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 20px;
        }
        .question { flex: 1; min-width: 0; }
        .editor-panel { flex: 1; min-width: 0; }
        .question h2 { margin-bottom: 10px; }
        .rank {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 13px;
            color: #fff;
            background: #2ecc71;
        }
        .desc {
            margin-top: 16px;
            white-space: pre-wrap;
            line-height: 1.8;
            color: #444;
        }
        .editor-panel h3 { margin-bottom: 10px; }
        textarea.code {
            width: 100%;
            height: 320px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            resize: vertical;
            background: #f8f9fa;
        }
        .btn {
            display: inline-block;
            margin-top: 14px;
            background: #3498db;
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background .2s;
        }
        .btn:hover { background: #2980b9; }
        .result {
            margin-top: 14px;
            padding: 14px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #eee;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>在线OJ</h1>
        <nav><a href="/">首页</a><a href="/all_questions">题目列表</a></nav>
    </div>

    <div class="container">
        <div class="card question">
            <h2>{{id}}. {{title}} <span class="rank">{{rank}}</span></h2>
            <div class="desc">{{desc}}</div>
        </div>

        <div class="card editor-panel">
            <h3>在线编辑区</h3>
            <textarea class="code" id="code" placeholder="在此编写你的代码...">{{pre_code}}</textarea>
            <div>
                <button class="btn" onclick="submitCode()">提交评测</button>
            </div>
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        function submitCode() {
            var code = document.getElementById('code').value;
            var result = document.getElementById('result');
            result.style.display = 'block';
            result.textContent = '正在评测中，请稍候...';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/judge/{{id}}', true);
            xhr.setRequestHeader('Content-Type', 'application/json;charset=utf-8');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var text = '状态: ' + data.reason + '\n';
                    if (data.stdout) text += '输出:\n' + data.stdout + '\n';
                    if (data.stderr) text += '错误输出:\n' + data.stderr + '\n';
                    result.textContent = text;
                } else if (xhr.readyState === 4) {
                    result.textContent = '评测请求失败: HTTP ' + xhr.status;
                }
            };
            xhr.send(JSON.stringify({ code: code }));
        }
    </script>
</body>
</html>
