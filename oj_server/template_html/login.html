<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 在线OJ</title>
    <style>
        :root {
            --primary: #0EA5E9;
            --primary-dark: #0369A1;
            --accent: #F97316;
            --accent-soft: #FFF7ED;
            --bg: #F0F9FF;
            --card: #FFFFFF;
            --text: #0C4A6E;
            --muted: #64748B;
            --border: #E0F2FE;
            --shadow: 0 8px 30px rgba(14, 165, 233, 0.12);
            --danger: #DC2626;
            --danger-soft: #FEF2F2;
            --success: #059669;
            --success-soft: #ECFDF5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .bg-decor {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(40% 30% at 15% 12%, rgba(56, 189, 248, 0.18), transparent 70%),
                radial-gradient(35% 30% at 88% 8%, rgba(249, 115, 22, 0.10), transparent 70%),
                radial-gradient(45% 35% at 80% 90%, rgba(56, 189, 248, 0.14), transparent 70%),
                linear-gradient(180deg, #F0F9FF 0%, #E0F2FE 100%);
        }
        .header {
            position: sticky; top: 14px; z-index: 50;
            max-width: 960px; margin: 14px auto 0; padding: 10px 22px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
        .brand svg { color: var(--primary); }
        .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
        .brand h1 em { font-style: normal; color: var(--accent); }
        .header nav a {
            color: var(--text); text-decoration: none; font-size: 14px;
            padding: 7px 16px; border-radius: 10px;
            background: rgba(14,165,233,0.08); border: 1px solid var(--border);
            transition: all .25s ease;
        }
        .header nav a:hover { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(14,165,233,0.35); }

        .container { max-width: 480px; margin: 44px auto 20px; padding: 0 20px; }
        .hero { text-align: center; padding: 6px 0 24px; }
        .hero .eyebrow {
            display: inline-block; font-size: 13px; color: var(--primary-dark);
            background: rgba(14,165,233,0.10); border: 1px solid var(--border);
            padding: 4px 14px; border-radius: 999px; margin-bottom: 12px; letter-spacing: 2px;
        }
        .hero h2 { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: 30px; font-weight: 700; letter-spacing: 2px; }
        .hero .quote { margin-top: 8px; color: var(--muted); font-size: 14px; }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; box-shadow: var(--shadow); padding: 30px 28px;
        }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; }
        .field input {
            width: 100%; padding: 11px 14px; font-size: 14px;
            border: 1px solid var(--border); border-radius: 10px;
            background: #FBFEFF; color: var(--text); font-family: inherit;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,233,0.15); }

        .btn {
            display: block; width: 100%;
            background: linear-gradient(135deg, #F97316, #FB923C); color: #fff;
            border: none; padding: 12px 32px; font-size: 15px; font-weight: 600;
            border-radius: 12px; cursor: pointer; transition: all .25s ease;
            box-shadow: 0 4px 14px rgba(249,115,22,0.35);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(249,115,22,0.45); }
        .btn:disabled { opacity: 0.7; cursor: wait; transform: none; }

        .msg { padding: 11px 16px; border-radius: 10px; font-size: 14px; display: none; margin-bottom: 16px; }
        .msg.error { background: var(--danger-soft); color: #991B1B; border: 1px solid #FECACA; }
        .msg.success { background: var(--success-soft); color: #065F46; border: 1px solid #A7F3D0; }

        .footnote { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
        .footnote a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }
        .footnote a:hover { color: var(--primary); text-decoration: underline; }

        footer { text-align: center; color: var(--muted); font-size: 13px; padding: 26px 20px 34px; }
        footer .line { color: rgba(14,165,233,0.4); }
        @media (max-width: 480px) { .hero h2 { font-size: 24px; } }
    </style>
</head>
<body>
    <div class="bg-decor"></div>

    <header class="header">
        <a class="brand" href="/">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <h1>在线<em>OJ</em></h1>
        </a>
        <nav><a href="/register">没有账号？去注册</a></nav>
    </header>

    <div class="container">
        <div class="hero">
            <span class="eyebrow">欢迎回来</span>
            <h2>登录账号</h2>
            <p class="quote">“博学之，审问之，慎思之，明辨之，笃行之。”</p>
        </div>

        <div class="card">
            <div class="msg" id="msg"></div>
            <form id="loginform" onsubmit="return submitLogin(event)">
                <div class="field">
                    <label>用户名</label>
                    <input id="username" placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="field">
                    <label>密码</label>
                    <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button class="btn" id="submitBtn" type="submit">登 录</button>
            </form>
            <p class="footnote">还没有账号？<a href="/register">立即注册</a></p>
        </div>

        <footer><span class="line">✦</span> 温故而知新，可以为师矣 <span class="line">✦</span></footer>
    </div>

    <script>
        function showMsg(cls, t) {
            var m = document.getElementById('msg');
            m.className = 'msg ' + cls; m.style.display = 'block'; m.textContent = t;
        }

        function submitLogin(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            if (!username || !password) { showMsg('error', '用户名和密码不能为空'); return false; }

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            var payload = { username: username, password: password };

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/login', true);
            xhr.setRequestHeader('Content-Type', 'application/json;charset=utf-8');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = {};
                    try { data = JSON.parse(xhr.responseText); } catch (err) { }
                    if (data.ok) {
                        var tk = data.token || '';
                        try {
                            localStorage.setItem('oj_token', data.token || '');
                            localStorage.setItem('oj_username', data.username || username);
                            localStorage.setItem('oj_role', data.role || 'user');
                            sessionStorage.removeItem('oj_auth_fetched');
                        } catch (err) { }
                        showMsg('success', '登录成功，正在进入题库...');
                        setTimeout(function () {
                            if (tk) {
                                fetch('/all_questions', { headers: { 'Authorization': 'Bearer ' + tk } })
                                    .then(function (r) { return r.text(); })
                                    .then(function (html) {
                                        if (html.indexOf('id="oj-msg' + '-page"') === -1) { document.open(); document.write(html); document.close(); }
                                        else { location.href = '/all_questions'; }
                                    })
                                    .catch(function () { location.href = '/all_questions'; });
                            } else {
                                location.href = '/all_questions';
                            }
                        }, 500);
                    } else {
                        showMsg('error', data.message || '用户名或密码错误');
                        btn.disabled = false;
                    }
                } else if (xhr.readyState === 4) {
                    showMsg('error', '登录失败: HTTP ' + xhr.status);
                    btn.disabled = false;
                }
            };
            xhr.send(JSON.stringify(payload));
            return false;
        }
    </script>
</body>
</html>
