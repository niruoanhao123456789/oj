<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 在线OJ</title>
    <style>
        :root {
            --primary: #0EA5E9;
            --primary-dark: #0369A1;
            --accent: #F97316;
            --accent-soft: #FFF7ED;
            --bg: #F0F9FF;
            --card: #FFFFFF;
            --text: #0C4A6E;
            --muted: #64748B;
            --border: #E0F2FE;
            --shadow: 0 8px 30px rgba(14, 165, 233, 0.12);
            --danger: #DC2626;
            --danger-soft: #FEF2F2;
            --success: #059669;
            --success-soft: #ECFDF5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .bg-decor {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(40% 30% at 15% 12%, rgba(56, 189, 248, 0.18), transparent 70%),
                radial-gradient(35% 30% at 88% 8%, rgba(249, 115, 22, 0.10), transparent 70%),
                radial-gradient(45% 35% at 80% 90%, rgba(56, 189, 248, 0.14), transparent 70%),
                linear-gradient(180deg, #F0F9FF 0%, #E0F2FE 100%);
        }
        .header {
            position: sticky; top: 14px; z-index: 50;
            max-width: 960px; margin: 14px auto 0; padding: 10px 22px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
        .brand svg { color: var(--primary); }
        .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
        .brand h1 em { font-style: normal; color: var(--accent); }
        .header nav a {
            color: var(--text); text-decoration: none; font-size: 14px;
            padding: 7px 16px; border-radius: 10px;
            background: rgba(14,165,233,0.08); border: 1px solid var(--border);
            transition: all .25s ease;
        }
        .header nav a:hover { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(14,165,233,0.35); }

        .container { max-width: 560px; margin: 44px auto 20px; padding: 0 20px; }
        .hero { text-align: center; padding: 6px 0 24px; }
        .hero .eyebrow {
            display: inline-block; font-size: 13px; color: var(--primary-dark);
            background: rgba(14,165,233,0.10); border: 1px solid var(--border);
            padding: 4px 14px; border-radius: 999px; margin-bottom: 12px; letter-spacing: 2px;
        }
        .hero h2 { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: 30px; font-weight: 700; letter-spacing: 2px; }
        .hero .quote { margin-top: 8px; color: var(--muted); font-size: 14px; }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; box-shadow: var(--shadow); padding: 30px 28px;
        }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; }
        .field input {
            width: 100%; padding: 11px 14px; font-size: 14px;
            border: 1px solid var(--border); border-radius: 10px;
            background: #FBFEFF; color: var(--text); font-family: inherit;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,233,0.15); }
        .field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

        .role-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .role-card {
            border: 2px solid var(--border); border-radius: 14px;
            padding: 16px 14px; text-align: center; cursor: pointer;
            transition: all .25s ease; background: #FBFEFF;
        }
        .role-card svg { color: var(--primary); margin-bottom: 6px; }
        .role-card b { display: block; font-size: 15px; color: var(--text); }
        .role-card p { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .role-card:hover { border-color: var(--primary); background: #F0F9FF; }
        .role-card.active {
            border-color: var(--primary);
            background: #F0F9FF;
            box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
        }
        .role-card.active svg { color: var(--primary-dark); }
        .role-card.active b { color: var(--primary-dark); }

        .btn {
            display: block; width: 100%;
            background: linear-gradient(135deg, #F97316, #FB923C); color: #fff;
            border: none; padding: 12px 32px; font-size: 15px; font-weight: 600;
            border-radius: 12px; cursor: pointer; transition: all .25s ease;
            box-shadow: 0 4px 14px rgba(249,115,22,0.35);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(249,115,22,0.45); }
        .btn:disabled { opacity: 0.7; cursor: wait; transform: none; }

        .msg { padding: 11px 16px; border-radius: 10px; font-size: 14px; display: none; margin-bottom: 16px; }
        .msg.error { background: var(--danger-soft); color: #991B1B; border: 1px solid #FECACA; }
        .msg.success { background: var(--success-soft); color: #065F46; border: 1px solid #A7F3D0; }

        .footnote { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
        .footnote a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }
        .footnote a:hover { color: var(--primary); text-decoration: underline; }

        footer { text-align: center; color: var(--muted); font-size: 13px; padding: 26px 20px 34px; }
        footer .line { color: rgba(14,165,233,0.4); }
        @media (max-width: 480px) { .role-cards { grid-template-columns: 1fr; } .hero h2 { font-size: 24px; } }
    </style>
</head>
<body>
    <div class="bg-decor"></div>

    <header class="header">
        <a class="brand" href="/">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <h1>在线<em>OJ</em></h1>
        </a>
        <nav><a href="/login">已有账号，去登录</a></nav>
    </header>

    <div class="container">
        <div class="hero">
            <span class="eyebrow">欢迎加入</span>
            <h2>注册账号</h2>
            <p class="quote">“非淡泊无以明志，非宁静无以致远。”</p>
        </div>

        <div class="card">
            <div class="msg" id="msg"></div>
            <form id="regform" onsubmit="return submitReg(event)">
                <div class="field">
                    <label>用户名</label>
                    <input id="username" placeholder="用于登录的用户名" autocomplete="username" required>
                </div>
                <div class="field">
                    <label>密码</label>
                    <input id="password" type="password" placeholder="至少 6 位" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label>注册身份</label>
                    <div class="role-cards">
                        <div class="role-card active" data-role="user" onclick="pickRole('user')">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <b>普通用户</b>
                            <p>提交评测，加入小组</p>
                        </div>
                        <div class="role-card" data-role="leader" onclick="pickRole('leader')">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                            <b>负责人</b>
                            <p>创建小组，发布题目</p>
                        </div>
                    </div>
                </div>
                <div class="field" id="inviteField" style="display:none;">
                    <label>管理员邀请码</label>
                    <input id="invite_code" placeholder="注册负责人需填写管理员邀请码" autocomplete="off">
                    <p class="hint">负责人身份由管理员签发邀请码开通，一个邀请码可注册一名负责人</p>
                </div>
                <button class="btn" id="submitBtn" type="submit">立即注册</button>
            </form>
            <p class="footnote">已有账号？<a href="/login">直接登录</a></p>
        </div>

        <footer><span class="line">✦</span> 学而时习之，不亦说乎 <span class="line">✦</span></footer>
    </div>

    <script>
        var role = 'user';

        function pickRole(r) {
            role = r;
            var cards = document.querySelectorAll('.role-card');
            for (var i = 0; i < cards.length; i++) {
                cards[i].classList.toggle('active', cards[i].getAttribute('data-role') === r);
            }
            document.getElementById('inviteField').style.display = (r === 'leader') ? 'block' : 'none';
        }

        function showMsg(cls, t) {
            var m = document.getElementById('msg');
            m.className = 'msg ' + cls; m.style.display = 'block'; m.textContent = t;
        }

        function submitReg(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var invite_code = document.getElementById('invite_code').value.trim();

            if (!username || !password) { showMsg('error', '用户名和密码不能为空'); return false; }
            if (password.length < 6) { showMsg('error', '密码长度至少 6 位'); return false; }
            if (role === 'leader' && !invite_code) { showMsg('error', '注册负责人需填写管理员邀请码'); return false; }

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            var payload = { username: username, password: password, role: role };
            if (role === 'leader') payload.invite_code = invite_code;

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/register', true);
            xhr.setRequestHeader('Content-Type', 'application/json;charset=utf-8');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = {};
                    try { data = JSON.parse(xhr.responseText); } catch (err) { }
                    if (data.ok) {
                        showMsg('success', '注册成功，正在前往登录...');
                        setTimeout(function () { location.href = '/login'; }, 900);
                    } else {
                        showMsg('error', data.message || '注册失败');
                        btn.disabled = false;
                    }
                } else if (xhr.readyState === 4) {
                    showMsg('error', '注册失败: HTTP ' + xhr.status);
                    btn.disabled = false;
                }
            };
            xhr.send(JSON.stringify(payload));
            return false;
        }
    </script>
</body>
</html>
